[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gradius-neo-python"
version = "0.1.0"
description = "Direct Python port of Gradius Neo"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
gradius-neo = "gradius_neo.runner:main"

[tool.setuptools.package-data]
gradius_neo = ["*.py"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-prototype/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: browser-prototype-ts/package-lock.json

      - name: Install generator dependencies
        working-directory: browser-prototype-ts
        run: npm ci

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./python-prototype[dev]"

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest python-prototype/tests

  build-windows:
    needs: test-windows
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [demo, full]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-prototype/pyproject.toml

      - name: Bake edition into native build
        shell: pwsh
        run: |
          Set-Content `
            -Path python-prototype/src/gradius_neo/build_config.py `
            -Encoding utf8 `
            -Value 'GAME_EDITION = "${{ matrix.edition }}"'

      - name: Install native build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./python-prototype" nuitka ordered-set zstandard

      - name: Compile native Windows application
        shell: pwsh
        run: |
          python -m nuitka `
            --mode=standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --python-flag=no_asserts `
            --python-flag=no_docstrings `
            --include-package=gradius_neo `
            --include-module=pygame._sdl2.controller `
            --include-data-file=assets/gradius-neo-1080-v4.png=assets/gradius-neo-1080-v4.png `
            --include-data-dir=browser-prototype-ts/public/assets=resources `
            --output-dir=build/${{ matrix.edition }} `
            --output-filename=gradius-neo-${{ matrix.edition }}.exe `
            python-prototype/windows_launcher.py

      - name: Assemble portable Windows folder
        shell: pwsh
        run: |
          $edition = '${{ matrix.edition }}'
          $compiled = Get-ChildItem "build/$edition" -Directory -Filter '*.dist' | Select-Object -First 1
          if (-not $compiled) { throw "Nuitka standalone output is missing." }
          $package = "dist/gradius-neo-$edition"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "$($compiled.FullName)/*" $package -Recurse

      - name: Add user-facing files
        shell: pwsh
        run: |
          $edition = '${{ matrix.edition }}'
          $package = "dist/gradius-neo-$edition"
          New-Item -ItemType Directory -Force "$package/roms" | Out-Null
          Copy-Item python-prototype/windows/README.txt "$package/README.txt"
          Add-Content "$package/README.txt" "`nEdition: $($edition.ToUpperInvariant())"
          Copy-Item python-prototype/windows/ROM-README.txt "$package/roms/README.txt"

      - name: Verify that the original ROM is not bundled
        shell: pwsh
        run: |
          $edition = '${{ matrix.edition }}'
          $package = "dist/gradius-neo-$edition"
          $rom = Get-ChildItem $package -Recurse -Filter "gradius_neo_176x220-71722.jar"
          if ($rom) { throw "Original JAR must not be present in the Windows artifact." }
          if (-not (Test-Path "$package/gradius-neo-$edition.exe")) { throw "Windows executable is missing." }

      - name: Create download archive
        shell: pwsh
        run: |
          $edition = '${{ matrix.edition }}'
          Compress-Archive `
            -Path "dist/gradius-neo-$edition/*" `
            -DestinationPath "dist/gradius-neo-$edition-windows-x64.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: gradius-neo-${{ matrix.edition }}-windows-x64
          path: dist/gradius-neo-${{ matrix.edition }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
